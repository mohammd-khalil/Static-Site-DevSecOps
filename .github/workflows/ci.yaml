name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch: # run the ci pilpeline manually
# Permissions required for GHCR and SonarQube
permissions:
  contents: read
  packages: write 

jobs:
  sonarqube: # Check the code quality 
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@708c7c7110995f73a80a7a0c5cfee4e9961949a0 #v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@ad79b13d38cce47457fb4059994f2d79e1dc625a #v1.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          
  build-and-push:
    name: Build, Scan, and Push to GHCR
    runs-on: ubuntu-latest
    permissions: 
      contents: write
    needs: sonarqube 
    
    outputs:
      image-ref: ${{ steps.meta.outputs.image-ref }}
      image-tag: ${{ steps.meta.outputs.image-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image reference
        id: meta # This ID is what links to the outputs block above
        run: |
          # GHCR requires lowercase repository names
          LOWERED=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "image-ref=ghcr.io/${LOWERED}" >> "$GITHUB_OUTPUT"
          echo "image-tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Build Docker Image
        run: |
          docker build -f docker/Dockerfile -t "${{ steps.meta.outputs.image-ref }}:${{ steps.meta.outputs.image-tag }}" .
          docker tag "${{ steps.meta.outputs.image-ref }}:${{ steps.meta.outputs.image-tag }}" "${{ steps.meta.outputs.image-ref }}:latest"

      - name: Run Trivy Vulnerability Scanner # Scan the image 
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: '${{ steps.meta.outputs.image-ref }}:${{ steps.meta.outputs.image-tag }}'
          format: 'table'
          exit-code: '1'  # Fails the step (returns exit code 1) when matching vulnerabilities are found
          ignore-unfixed: true # Ignores CVEs that do not yet have an official vendor patch/fix available
          severity: 'CRITICAL,HIGH' # Only fail on Critical and High

      - name: Push Image to GHCR
        # Only pushes if Trivy scan passes (exit-code 0)
        run: |
           docker push "${{ steps.meta.outputs.image-ref }}:${{ steps.meta.outputs.image-tag }}"
           docker push "${{ steps.meta.outputs.image-ref }}:latest"

  update-values:
    name: Update values.yaml With Image Tag
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write         
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history so we can branch/push cleanly

      - name: Install yq # lightweight command-line tool to edit values.yaml file
        run: |
          curl -sL --proto "=https" https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o /usr/bin/yq && chmod +x /usr/bin/yq

      - name: Update values.yaml
        env:
          # Map the outputs to clean environment variables
          IMAGE_REF: ${{ needs.build-and-push.outputs.image-ref }}   # already lowercase
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
          VALUES_FILE: "k8s/Helm/my-static-web/values.yaml"
        run: |
          # Use double quotes for the yq expression so bash expands the variables
          yq eval -i ".image.repository = \"$IMAGE_REF\"" "$VALUES_FILE"
          yq eval -i ".image.tag = \"$IMAGE_TAG\"" "$VALUES_FILE"
          
          echo "---- Updated values.yaml (image block) ----"
          yq eval '.image' "$VALUES_FILE"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout "${GITHUB_REF_NAME}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git add "$VALUES_FILE"
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(ci): update image to ${{ needs.build-and-push.outputs.image-ref }}:${{ needs.build-and-push.outputs.image-tag }} [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
